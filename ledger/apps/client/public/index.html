<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        flex: 1;
      }
    </style>
    <!-- Tauri adds its per-response CSP nonce before RN Web inserts CSS rules.
         RN Web reuses this sheet; a newly created, nonce-less style is blocked. -->
    <style id="react-native-stylesheet"></style>
  </head>
  <body>
    <noscript>请启用 JavaScript 以运行简账。</noscript>
    <div id="root"></div>
  </body>
</html>
