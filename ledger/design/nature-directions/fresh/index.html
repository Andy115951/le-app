<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>简账 · 白底简约版草稿</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #edf1e9;
        --paper: #fcfdf9;
        --ink: #263c30;
        --secondary: #647668;
        --muted: #98a296;
        --line: #e9eee4;
        --green: #426e4a;
        --deep: #315739;
        --sage: #e6efd9;
        --mint: #f1f5e9;
        --orange: #b8804d;
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        color: inherit;
        border: 0;
        background: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--orange);
        outline-offset: 4px;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:active {
        opacity: 0.7;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      svg {
        width: 21px;
        height: 21px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      input {
        min-width: 0;
      }
      input[type="search"]::-webkit-search-cancel-button {
        -webkit-appearance: none;
      }
      input::placeholder {
        color: #a0aa9b;
      }
      button,
      input {
        -webkit-appearance: none;
      }
      input[type="checkbox"] {
        appearance: auto;
      }
      .studio {
        max-width: 1240px;
        margin: auto;
        padding: 28px 30px 0;
      }
      .studio-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
      }
      .studio-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        letter-spacing: 2px;
        font-weight: 600;
      }
      .studio-brand svg {
        color: var(--green);
        width: 25px;
        height: 25px;
      }
      .studio-brand small {
        font-size: 10px;
        font-weight: 400;
        letter-spacing: 1.2px;
        color: #84907f;
        margin-left: 8px;
      }
      .old-link {
        font-size: 11px;
        color: #7d8976;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .old-link svg {
        width: 13px;
        height: 13px;
      }
      .studio-intro {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 25px;
        padding: 28px 0 22px;
      }
      .studio-intro h1 {
        font-size: 25px;
        line-height: 1.4;
        font-weight: 500;
        margin: 0 0 8px;
        letter-spacing: 0.5px;
      }
      .studio-intro p {
        font-size: 12px;
        color: #7a8872;
        margin: 0;
        line-height: 1.8;
      }
      .view-toggle {
        display: flex;
        gap: 3px;
        background: #e1e8d9;
        padding: 3px;
        border-radius: 7px;
        flex-shrink: 0;
      }
      .view-toggle button {
        font-size: 12px;
        color: #718066;
        padding: 8px 13px;
        border-radius: 5px;
      }
      .view-toggle button[aria-pressed="true"] {
        background: #fbfcf6;
        color: var(--deep);
        box-shadow: 0 1px 3px #32442d09;
      }
      .studio-pages {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        border-top: 1px solid #d6dece;
        padding: 12px 0 17px;
      }
      .page-tabs {
        display: flex;
        gap: 6px;
      }
      .page-tabs button {
        padding: 8px 13px;
        font-size: 12px;
        color: #7c8973;
        min-height: 34px;
      }
      .page-tabs button[aria-current="page"] {
        color: var(--deep);
        background: #e0e8d7;
        border-radius: 5px;
      }
      .draft-disclaimer {
        font-size: 10px;
        color: #909b86;
        white-space: nowrap;
      }
      .stage {
        max-width: 1180px;
        padding: 0 26px 38px;
        margin: 0 auto;
      }
      .single-stage {
        display: grid;
        grid-template-columns: 390px 320px;
        justify-content: center;
        gap: 78px;
        align-items: start;
      }
      .preview-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: #839078;
        letter-spacing: 0.5px;
        margin: 8px 4px 13px;
      }
      .preview-label strong {
        font-weight: 500;
        color: #4b6343;
        font-size: 12px;
      }
      .preview-label button {
        font-size: 10px;
        display: flex;
        align-items: center;
        gap: 4px;
        color: #7b8b71;
        padding: 0;
      }
      .preview-label svg {
        width: 12px;
        height: 12px;
      }
      .phone {
        width: 100%;
        height: 852px;
        position: relative;
        display: flex;
        flex-direction: column;
        border: 1px solid #d5ddce;
        box-shadow: 0 16px 35px #3c58340c;
        border-radius: 23px;
        overflow: hidden;
        background: var(--paper);
        isolation: isolate;
        color: var(--ink);
        font-size: 14px;
      }
      .status {
        height: 37px;
        padding: 13px 24px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        font-size: 11px;
        font-weight: 600;
        z-index: 1;
      }
      .status-signals {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .status-signals svg {
        width: 13px;
        height: 13px;
        stroke-width: 1.7;
      }
      .page-scroll {
        overflow: auto;
        flex: 1;
        min-height: 0;
        scrollbar-width: none;
      }
      .page-scroll::-webkit-scrollbar {
        display: none;
      }
      .page {
        padding: 15px 25px 116px;
        min-height: 100%;
      }
      .page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 0 0 24px;
        min-height: 36px;
      }
      .page-head h2 {
        font-size: 26px;
        line-height: 1.3;
        letter-spacing: 0.2px;
        font-weight: 600;
        margin: 0;
      }
      .app-brand {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .app-brand svg {
        width: 23px;
        height: 23px;
        color: var(--green);
      }
      .head-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .head-icon {
        width: 35px;
        height: 35px;
        display: grid;
        place-items: center;
        color: #6c7d65;
      }
      .head-icon svg {
        width: 20px;
        height: 20px;
      }
      .month-button {
        display: flex;
        gap: 7px;
        align-items: center;
        color: #6a7c61;
        font-size: 12px;
        min-height: 36px;
        padding: 5px 8px 5px 10px;
        background: #f1f5e9;
        border-radius: 9px;
      }
      .month-button svg {
        width: 12px;
        height: 12px;
      }
      .spend-summary {
        background: linear-gradient(120deg, #e5efda, #eaf1df);
        padding: 22px 21px 21px;
        position: relative;
        border-radius: 18px;
        overflow: hidden;
        margin: 0 -3px 22px;
      }
      .spend-summary .little-label {
        color: #738565;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
      }
      .spend-summary .little-label svg {
        width: 14px;
        height: 14px;
        opacity: 0.7;
      }
      .hero-amount {
        font-size: 51px;
        font-weight: 500;
        letter-spacing: -1.8px;
        font-variant-numeric: tabular-nums;
        line-height: 1.16;
        white-space: nowrap;
      }
      .currency {
        font-size: 0.43em;
        font-weight: 400;
        letter-spacing: 0;
        margin-right: 6px;
        vertical-align: baseline;
      }
      .decimals {
        font-size: 0.55em;
        letter-spacing: -0.5px;
        font-weight: 400;
        opacity: 0.78;
      }
      .summary-secondary {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-top: 22px;
        padding-top: 16px;
        border-top: 1px solid #cfddbf8c;
      }
      .summary-secondary span {
        font-size: 10px;
        color: #7a8a6c;
        display: block;
        margin-bottom: 7px;
      }
      .summary-secondary strong {
        font-size: 17px;
        letter-spacing: -0.3px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .summary-secondary .surplus {
        color: var(--green);
      }
      .seed-mark {
        position: absolute;
        width: 45px;
        height: 46px;
        right: 17px;
        top: 15px;
        color: #9db988;
        opacity: 0.65;
        transform: rotate(8deg);
      }
      .seed-mark svg {
        width: 45px;
        height: 46px;
        stroke-width: 1.2;
      }
      .asset-peek {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        gap: 12px;
        padding: 0 0 22px;
        margin-bottom: 22px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .asset-peek-label {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #6e7e66;
        font-size: 12px;
      }
      .asset-peek-label svg {
        width: 17px;
        height: 17px;
        color: #849b72;
      }
      .asset-peek-value {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      .asset-peek-value svg {
        width: 13px;
        height: 13px;
        color: #9caa90;
      }
      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 7px;
        min-height: 25px;
        gap: 12px;
      }
      .section-heading h3 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.1px;
        margin: 0;
      }
      .text-button {
        font-size: 11px;
        color: #8b9b7d;
        display: flex;
        gap: 4px;
        align-items: center;
        padding: 3px 0;
      }
      .text-button svg {
        width: 13px;
        height: 13px;
      }
      .day-heading {
        font-size: 10px;
        color: #a0ab96;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 17px 0 6px;
        letter-spacing: 0.1px;
      }
      .transaction {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
        gap: 10px;
        padding: 15px 0;
        min-height: 65px;
      }
      .tx-left {
        display: flex;
        gap: 12px;
        align-items: center;
        min-width: 0;
      }
      .tx-icon {
        width: 30px;
        min-width: 30px;
        height: 34px;
        display: grid;
        place-items: center;
        color: #7e9670;
      }
      .tx-icon svg {
        width: 21px;
        height: 21px;
        stroke-width: 1.6;
      }
      .tx-info {
        min-width: 0;
      }
      .tx-title {
        font-size: 14px;
        line-height: 1.4;
        margin: 0 0 5px;
        display: block;
        font-weight: 400;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 178px;
      }
      .tx-subtitle {
        font-size: 10px;
        color: #a0ab97;
        line-height: 1.4;
        display: block;
        white-space: nowrap;
      }
      .tx-amount {
        font-size: 17px;
        letter-spacing: -0.3px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .positive {
        color: #60915c;
      }
      .overview .day-heading {
        padding-top: 12px;
      }
      .overview .transaction {
        padding: 12px 0;
        min-height: 61px;
      }
      .overview .transaction + .transaction {
        border-top: 1px solid #edf0e8;
      }
      .overview-note {
        text-align: center;
        color: #a8b29f;
        font-size: 10px;
        margin: 23px 0 0;
        letter-spacing: 0.8px;
      }
      .floating-nav {
        position: absolute;
        bottom: 17px;
        left: 16px;
        right: 16px;
        height: 69px;
        z-index: 10;
        display: flex;
        align-items: center;
        padding: 6px 5px 5px;
        background: #f9fcf3f2;
        border: 1px solid #d4deca8c;
        box-shadow:
          0 4px 20px #30553012,
          0 1px 4px #30553008;
        border-radius: 24px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .floating-nav .nav-button {
        position: relative;
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
        justify-content: center;
        color: #a4ad9a;
        font-size: 9px;
        padding: 5px 0;
        height: 55px;
      }
      .floating-nav .nav-button svg {
        width: 19px;
        height: 19px;
        stroke-width: 1.7;
      }
      .floating-nav .nav-button.active {
        color: var(--deep);
      }
      .floating-nav .nav-button.active:after {
        content: "";
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        bottom: 0;
        background: #709660;
      }
      .floating-nav .nav-button.add {
        gap: 3px;
      }
      .floating-nav .add-mark {
        width: 43px;
        height: 35px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: var(--green);
        color: #fff;
        box-shadow: 0 2px 4px #416b3a13;
      }
      .floating-nav .add-mark svg {
        width: 22px;
        height: 22px;
        stroke-width: 1.8;
      }
      .floating-nav .nav-button.add.active:after {
        display: none;
      }
      .details .page-head {
        margin-bottom: 26px;
      }
      .flow-summary {
        display: flex;
        gap: 28px;
        margin-bottom: 24px;
      }
      .flow-summary div {
        flex: 1;
      }
      .flow-summary span {
        display: block;
        font-size: 10px;
        color: #8d9d7f;
        margin-bottom: 9px;
      }
      .flow-summary strong {
        font-size: 25px;
        font-weight: 500;
        letter-spacing: -0.7px;
        font-variant-numeric: tabular-nums;
      }
      .flow-summary small {
        font-size: 15px;
        opacity: 0.8;
        font-weight: 400;
      }
      .search-field {
        height: 42px;
        background: #f0f4e9;
        border-radius: 10px;
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 0 12px;
        margin-bottom: 22px;
        color: #9eab91;
      }
      .search-field svg {
        width: 16px;
        height: 16px;
      }
      .search-field input {
        border: 0;
        background: none;
        outline: none;
        width: 100%;
        color: var(--ink);
        font-size: 12px;
        height: 42px;
      }
      .segment-tabs {
        display: flex;
        gap: 25px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 7px;
      }
      .segment-tabs button {
        font-size: 12px;
        color: #a3ad98;
        position: relative;
        padding: 0 1px 13px;
        min-height: 31px;
      }
      .segment-tabs button.active {
        color: var(--deep);
        font-weight: 500;
      }
      .segment-tabs button.active:after {
        content: "";
        height: 2px;
        background: #648d55;
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        border-radius: 1px;
      }
      .transaction-group {
        padding-bottom: 7px;
      }
      .transaction-group + .transaction-group {
        border-top: 1px solid var(--line);
        margin-top: 7px;
      }
      .empty-state {
        color: #9ba88e;
        font-size: 12px;
        line-height: 1.8;
        padding: 38px 0;
        text-align: center;
      }
      .record-count {
        text-align: center;
        font-size: 10px;
        color: #a3ad97;
        margin-top: 23px;
      }
      .entry .page-head {
        margin-bottom: 20px;
      }
      .entry .segment-tabs {
        border: 0;
        margin-bottom: 20px;
        gap: 30px;
      }
      .entry .segment-tabs button {
        padding-bottom: 9px;
      }
      .amount-field {
        margin-bottom: 23px;
      }
      .field-eyebrow {
        font-size: 10px;
        color: #9aa78c;
        margin: 0 0 10px;
      }
      .amount-field-main {
        display: flex;
        align-items: baseline;
        gap: 9px;
      }
      .amount-field-main .currency {
        font-size: 24px;
        color: #6c8260;
        margin: 0;
      }
      .amount-field input {
        width: 100%;
        border: 0;
        background: none;
        padding: 0;
        outline: none;
        color: var(--ink);
        font-size: 57px;
        line-height: 1.12;
        letter-spacing: -2px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        height: 66px;
      }
      .entry-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 17px;
        margin-bottom: 4px;
      }
      .option-control {
        width: 100%;
        text-align: left;
        display: block;
        min-height: 58px;
        padding: 7px 0 13px;
        border-bottom: 1px solid var(--line);
      }
      .option-control label {
        font-size: 10px;
        color: #9da990;
        display: block;
        margin-bottom: 9px;
        pointer-events: none;
      }
      .option-value {
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .option-value svg {
        width: 12px;
        height: 12px;
        color: #a6b19a;
      }
      .entry-notes {
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 15px;
        min-height: 46px;
        margin-bottom: 20px;
      }
      .entry-notes label {
        color: #a0ac92;
        font-size: 10px;
        flex-shrink: 0;
      }
      .entry-notes input {
        outline: 0;
        border: 0;
        background: none;
        width: 100%;
        padding: 9px 0;
        color: var(--ink);
        font-size: 12px;
      }
      .label-selection .field-eyebrow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 0 10px;
      }
      .label-selection .field-eyebrow button {
        font-size: 10px;
        color: #9aaa89;
        padding: 0;
      }
      .tag-options {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .tag-options button {
        font-size: 11px;
        padding: 8px 13px;
        color: #9eaa92;
        border-radius: 8px;
        background: #f3f6ed;
        min-height: 31px;
      }
      .tag-options button.selected {
        background: #e0ecd1;
        color: #527447;
      }
      .tag-options button.no-tag {
        background: none;
        color: #a9b29e;
      }
      .keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        margin: 20px -7px 13px;
        gap: 0 8px;
      }
      .keypad button {
        height: 42px;
        display: grid;
        place-items: center;
        font-size: 26px;
        font-weight: 400;
        color: #42613e;
        border-radius: 8px;
      }
      .keypad button:hover {
        background: #edf3e5;
      }
      .keypad svg {
        width: 21px;
        height: 21px;
        color: #8b9e7a;
      }
      .primary-button {
        min-height: 46px;
        background: var(--green);
        color: #fff;
        width: 100%;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .primary-button svg {
        width: 17px;
        height: 17px;
        stroke-width: 2;
      }
      .entry-helper {
        text-align: center;
        color: #a6b29a;
        font-size: 9px;
        line-height: 1.8;
        margin: 10px 0 0;
      }
      .entry .transfer-hint {
        font-size: 10px;
        color: #9aaa8a;
        margin: 15px 0 0;
        line-height: 1.8;
      }
      .assets .page-head {
        margin-bottom: 28px;
      }
      .asset-total .field-eyebrow {
        font-size: 11px;
        margin-bottom: 11px;
      }
      .asset-total .hero-amount {
        font-size: 45px;
        font-weight: 500;
      }
      .asset-summary {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        padding: 21px 0 24px;
        margin-bottom: 7px;

          const r = records.find((r) => r.id === button.dataset.record);
          if (!r) return;
          title = r.name;
          description = `${r.date} ${r.time} · ${r.type === "income" ? "收入" : "支出"}`;
          body =
            `<input type="hidden" data-record-id value="${r.id}"><label class="sheet-field">金额 · 元<input class="large-field" aria-label="流水金额" value="${(r.minor / 100).toFixed(2)}" inputmode="decimal"></label><label class="sheet-field">备注<input aria-label="流水备注" value="${esc(r.name)}"></label><div class="sheet-amount-row"><span>账户</span><span>${esc(getAccount(r.account).name)}</span></div><div class="sheet-amount-row"><span>标签</span><span>${esc(r.label)}</span></div>` +
            sheetActions("完成预览", "done");
        } else if (type === "import") {
          title = "预览导入";
          description = "先核对，再决定是否替换。";
          body =
            '<div class="sample-preview"><span>5 个账户</span><span>8 笔流水</span></div><p class="backup-copy">导入会替换本机整本账，不做合并。正式版本会先校验文件，并自动保留当前账本备份。</p>' +
            sheetActions("确认替换", "done");
        } else {
          title = "导出 JSON 备份";
          description = "留一份完整账本，用于保存或迁移。";
          body =
            '<p class="backup-copy">备份是明文文件，拿到文件的人可以读取内容。请妥善保管。</p>' +
            sheetActions("导出备份", "done");
        }
        const shade = document.createElement("button");
        shade.className = "sheet-shade";
        shade.setAttribute("data-close-sheet", "");
        shade.setAttribute("aria-label", "关闭弹窗遮罩");
        const sheet = document.createElement("section");
        sheet.className = "sheet";
        sheet.setAttribute("role", "dialog");
        sheet.setAttribute("aria-label", title);
        sheet.innerHTML = `<div class="sheet-handle" aria-hidden="true"></div><div class="sheet-head"><h3>${esc(title)}</h3><button data-close-sheet aria-label="关闭弹窗">${icon("close")}</button></div><p class="sheet-description">${esc(description)}</p>${body}<p class="sheet-note">草稿操作仅在演示中生效，不读写真实账本。</p>`;
        host.append(shade, sheet);
      }
      function currentHost(page = state.page) {
        return (
          document.querySelector(`[data-app="${page}"]`) ||
          document.querySelector("[data-app]")
        );
      }
      function keyboard(k) {
        let s = state.amount;
        if (state.replaceAmount && k !== "⌫") {
          s = "";
          state.replaceAmount = false;
        }
        if (k === "⌫") s = s.slice(0, -1);
        else if (k === "." && !s.includes(".")) s = (s || "0") + ".";
        else if (/\d/.test(k) && s.length < 10) {
          if (!s.includes(".") || s.split(".")[1].length < 2)
            s = (s === "0" ? "" : s) + k;
        }
        state.amount = s;
        render();
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.hasAttribute("data-font-choice")) {
          state.fontChoice = b.dataset.fontChoice;
          applyFonts();
          return;
        }
        if (b.hasAttribute("data-tone-choice")) {
          state.tone = b.dataset.toneChoice;
          applyTone();
          return;
        }
        if (b.hasAttribute("data-view")) {
          state.view = b.dataset.view;
          render();
          return;
        }
        if (b.hasAttribute("data-page") || b.hasAttribute("data-experience")) {
          state.page = b.dataset.page || b.dataset.experience;
          if (state.page === "settings") state.settingsSub = null;
          if (state.view !== "desktop") state.view = "single";
          render();
          return;
        }
        const host = b.closest("[data-app]");
        if (!host) return;
        if (b.hasAttribute("data-close-sheet")) {
          closeSheet(host);
          return;
        }
        if (b.hasAttribute("data-nav")) {
          state.page = b.dataset.nav;
          if (state.page === "settings") state.settingsSub = null;
          if (state.view === "board") state.view = "single";
          render();
          return;
        }
        if (b.hasAttribute("data-sheet")) {
          showSheet(host, b.dataset.sheet, b);
          return;
        }
        if (b.hasAttribute("data-settings")) {
          state.settingsSub = b.dataset.settings || null;
          render();
          return;
        }
        if (b.hasAttribute("data-filter")) {
          state.filter = b.dataset.filter;
          render();
          return;
        }
        if (b.hasAttribute("data-entry-type")) {
          state.entryType = b.dataset.entryType;
          state.label = state.entryType === "income" ? "工资" : "餐饮";
          render();
          return;
        }
        if (b.hasAttribute("data-reset-entry")) {
          state.amount = "";
          state.note = "";
          state.label = "";
          state.replaceAmount = true;
          render();
          return;
        }
        if (b.hasAttribute("data-tag")) {
          state.label = b.dataset.tag;
          render();
          return;
        }
        if (b.hasAttribute("data-key")) {
          keyboard(b.dataset.key);
          return;
        }
        if (b.hasAttribute("data-save-entry")) {
          if (!Number(state.amount) || Number(state.amount) <= 0) {
            toast(host, "先填一个有效金额。");
            return;
          }
          if (
            state.entryType === "transfer" &&
            state.account === state.targetAccount
          ) {
            toast(host, "转出和转入账户需要不同。");
            return;
          }
          toast(host, "已体验记账流程 · 没有写入真实账本。");
          return;
        }
        if (b.hasAttribute("data-select-account")) {
          state[
            b.dataset.accountTarget === "true" ? "targetAccount" : "account"
          ] = b.dataset.selectAccount;
          render();
          return;
        }
        if (b.hasAttribute("data-select-month")) {
          state.month = Number(b.dataset.selectMonth);
          render();
          return;
        }
        if (b.hasAttribute("data-select-label")) {
          state.label = b.dataset.selectLabel;
          render();
          return;
        }
        if (b.hasAttribute("data-switch")) {
          b.setAttribute(
            "aria-checked",
            b.getAttribute("aria-checked") !== "true",
          );
          return;
        }
        if (b.hasAttribute("data-sheet-action")) {
          const action = b.dataset.sheetAction;
          const name = host.querySelector("[data-sheet-name]")?.value.trim();
          if (action === "date") {
            const date = host.querySelector("[data-sheet-date]").value;
            if (date) state.date = date;
          } else if (action === "accountEdit") {
            if (!name) {
              toast(host, "名称不能为空。");
              return;
            }
            getAccount(host.querySelector("[data-edit-account]").value).name =
              name;
          } else if (action === "valuation") {
            const value = host.querySelector("[data-sheet-value]").value;
            if (!/^\d+(\.\d{1,2})?$/.test(value) || Number(value) > 99999999) {
              toast(host, "填写有效的金额，最多两位小数。");
              return;
            }
            getAccount("investment").minor = Math.round(Number(value) * 100);
          } else if (action === "labelAdd" || action === "labelEdit") {
            if (!name) {
              toast(host, "标签名称不能为空。");
              return;
            }
            if (action === "labelAdd") {
              if (!state.labels.includes(name)) state.labels.push(name);
            } else {
              const old = host.querySelector("[data-old-label]").value;
              for (const collection of [state.labels, state.incomeLabels]) {
                const i = collection.indexOf(old);
                if (i >= 0) collection[i] = name;
              }
              if (state.label === old) state.label = name;
            }
          }
          const page = host.dataset.app;
          closeSheet(host);
          render();
          toast(
            currentHost(page),
            action === "done"
              ? "操作样式预览完成 · 未读写账本或生成文件。"
              : "仅更新这份演示 · 真实账本未改动。",
          );
          return;
        }
      });
      document.addEventListener("input", (e) => {
        const el = e.target;
        if (el.hasAttribute("data-amount")) {
          const parts = el.value.replace(/[^0-9.]/g, "").split(".");
          state.amount =
            parts[0] +
            (parts.length > 1 ? "." + parts.slice(1).join("").slice(0, 2) : "");
          state.replaceAmount = false;
          el.value = state.amount;
        } else if (el.hasAttribute("data-note")) state.note = el.value;
        else if (el.hasAttribute("data-search")) {
          state.search = el.value;
          el
            .closest("[data-app]")
            .querySelector(".transactions-body").innerHTML = detailsBody();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape")
          document.querySelectorAll("[data-app]").forEach(closeSheet);
      });
      render();
    </script>
  </body>
</html>
