<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>糖记 · 手机预览</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef1eb; color: #293e35; font: 14px/1.6 system-ui, sans-serif; }
  header { max-width: 920px; margin: 0 auto; padding: 22px 20px 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; } p { margin: 3px 0 0; color: #687c6c; font-size: 12px; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  button, a { font: inherit; color: inherit; border: 1px solid #dce4d7; background: white; padding: 7px 12px; border-radius: 10px; cursor: pointer; text-decoration: none; }
  button[aria-pressed="true"] { background: #397965; color: white; border-color: #397965; }
  button:focus-visible, a:focus-visible { outline: 3px solid #91ad89; outline-offset: 3px; }
  main { padding: 0 16px 24px; display: flex; justify-content: center; }
  .device { box-sizing: content-box; width: 390px; max-width: calc(100% - 2px); height: 844px; border: 1px solid #cdd7c7; border-radius: 24px; overflow: hidden; background: #f8f9f5; box-shadow: 0 10px 40px #293e3512; }
  iframe { border: 0; display: block; width: 100%; height: 100%; }
</style>
<header>
  <div><h1>糖记 · 手机预览</h1><p>切换屏幕宽度，保留当前页面和填写内容。</p></div>
  <nav aria-label="预览屏幕宽度">
    <button type="button" data-width="320" aria-pressed="false">320</button>
    <button type="button" data-width="360" aria-pressed="false">360</button>
    <button type="button" data-width="390" aria-pressed="true">390</button>
    <button type="button" data-width="412" aria-pressed="false">412</button>
    <a href="/" target="_blank" rel="noopener">独立打开</a>
  </nav>
</header>
<main><div class="device"><iframe src="/" title="糖记手机预览"></iframe></div></main>
<script>
  const device = document.querySelector('.device');
  document.querySelectorAll('[data-width]').forEach(button => button.addEventListener('click', () => {
    device.style.width = `${Number(button.dataset.width)}px`;
    document.querySelectorAll('[data-width]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
  }));
</script>
</html>
